<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #1E2233; font-family: Manrope, Ubuntu, Cantarell, sans-serif; color: #F2F3F7; }
    button { font-family: inherit; cursor: pointer; }
    input { font-family: inherit; }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; background: #1E2233; overflow: hidden;">

  <dc-import name="Sidebar" active="browse" hint-size="150px,800px"></dc-import>

  <div style="position: relative; flex-grow: 1; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0;">

    <!-- dimmed Browse behind -->
    <div style="opacity: 0.4; display: flex; flex-direction: column; gap: 14px;">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em;">Browse</h1>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;">
        <div style="height: 176px; border-radius: 14px; background: #252A3E; border: 1px solid rgba(255,255,255,0.07);"></div>
        <div style="height: 176px; border-radius: 14px; background: #252A3E; border: 2px solid #FFC700;"></div>
        <div style="height: 176px; border-radius: 14px; background: #252A3E; border: 1px solid rgba(255,255,255,0.07);"></div>
        <div style="height: 176px; border-radius: 14px; background: #252A3E; border: 1px solid rgba(255,255,255,0.07);"></div>
        <div style="height: 176px; border-radius: 14px; background: #252A3E; border: 1px solid rgba(255,255,255,0.07);"></div>
        <div style="height: 176px; border-radius: 14px; background: #252A3E; border: 1px solid rgba(255,255,255,0.07);"></div>
        <div style="height: 176px; border-radius: 14px; background: #252A3E; border: 1px solid rgba(255,255,255,0.07);"></div>
        <div style="height: 176px; border-radius: 14px; background: #252A3E; border: 1px solid rgba(255,255,255,0.07);"></div>
      </div>
    </div>

    <!-- scrim -->
    <div style="position: absolute; inset: 0; background: rgba(8,11,20,0.55);"></div>

    <!-- modal -->
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 424px; box-sizing: border-box; padding: 20px; border-radius: 16px; background: #252A3E; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 26px 70px rgba(0,0,0,0.55); display: flex; flex-direction: column; gap: 14px;">

      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 16px; font-weight: 800;">Add to Collection</span>
        <span style="font-size: 12px; color: #9AA0B0;">valley-fog-pines.png</span>
      </div>

      <!-- existing collections -->
      <div style="display: flex; flex-direction: column; gap: 6px;">

        <div style="display: flex; align-items: center; gap: 11px; height: 44px; padding: 0 12px; border-radius: 10px; background: #2B3044; border: 1px solid rgba(255,199,0,0.28);">
          <span style="width: 19px; height: 19px; border-radius: 6px; background: #FFC700; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#1A1400" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </span>
          <div style="display: flex; flex-direction: column; gap: 1px;">
            <span style="font-size: 12.5px; font-weight: 700;">Dark &amp; moody</span>
            <span style="font-size: 10.5px; color: #9AA0B0;">28 images</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 11px; height: 44px; padding: 0 12px; border-radius: 10px; background: #1E2233; border: 1px solid rgba(255,255,255,0.08);">
          <span style="width: 19px; height: 19px; border-radius: 6px; background: transparent; border: 1.6px solid rgba(255,255,255,0.3);"></span>
          <div style="display: flex; flex-direction: column; gap: 1px;">
            <span style="font-size: 12.5px; font-weight: 700;">Landscapes</span>
            <span style="font-size: 10.5px; color: #9AA0B0;">146 images</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 11px; height: 44px; padding: 0 12px; border-radius: 10px; background: #1E2233; border: 1px solid rgba(255,255,255,0.08);">
          <span style="width: 19px; height: 19px; border-radius: 6px; background: transparent; border: 1.6px solid rgba(255,255,255,0.3);"></span>
          <div style="display: flex; flex-direction: column; gap: 1px;">
            <span style="font-size: 12.5px; font-weight: 700;">Ultrawide 21:9</span>
            <span style="font-size: 10.5px; color: #9AA0B0;">12 images</span>
          </div>
          <span style="flex-grow: 1;"></span>
          <span style="padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.06); color: #9AA0B0; font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em;">SMART</span>
        </div>

      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.08);"></div>

      <!-- new collection -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 9px; flex-grow: 1; height: 38px; padding: 0 12px; border-radius: 10px; background: #1E2233; border: 1px solid rgba(255,199,0,0.4);">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#FFC700" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <input type="text" value="Cool blues" style="flex-grow: 1; border: 0; background: transparent; color: #F2F3F7; font-size: 12.5px; font-weight: 600; outline: none;">
        </div>
        <button type="button" style="height: 38px; padding: 0 15px; border: 0; border-radius: 10px; background: #FFC700; color: #1A1400; font-size: 12px; font-weight: 800;">Create</button>
      </div>

      <!-- footer -->
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 2px;">
        <span style="flex-grow: 1;"></span>
        <button type="button" style="height: 34px; padding: 0 16px; border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; background: transparent; color: #F2F3F7; font-size: 12px; font-weight: 700;">Cancel</button>
        <button type="button" style="height: 34px; padding: 0 20px; border: 0; border-radius: 999px; background: #FFC700; color: #1A1400; font-size: 12px; font-weight: 800;">Done</button>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
