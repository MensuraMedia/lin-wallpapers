<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #252A3E; font-family: Manrope, Ubuntu, Cantarell, sans-serif; color: #F2F3F7; }
    a { color: #FFC700; } a:hover { color: #FFDA5E; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 150px; height: 800px; box-sizing: border-box; padding: 16px 12px; background: #252A3E; border-right: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 18px;">

  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start;">
    <div style="width: 46px; height: 46px; border-radius: 14px; background-image: linear-gradient(140deg, #FFC700 0%, #FFB500 100%); display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#1A1400" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="m3 14 4.5-4 3.5 3 3.5-4L21 14"/><circle cx="9" cy="8.5" r="1.3"/><path d="M8 20h8"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.01em;">Lin Wallpapers</span>
      <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #9AA0B0;">EVERY SCREEN</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border-radius: 8px; text-decoration: none; font-size: 12.5px; background: {{st.browse.bg}}; color: {{st.browse.fg}}; font-weight: {{st.browse.fw}};">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Browse
    </a>
    <a href="Image.dc.html" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border-radius: 8px; text-decoration: none; font-size: 12.5px; background: {{st.image.bg}}; color: {{st.image.fg}}; font-weight: {{st.image.fw}};">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 15 5-4.5 4 3.5 3.5-4L21 15"/></svg>
      Image
    </a>
    <a href="Screens.dc.html" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border-radius: 8px; text-decoration: none; font-size: 12.5px; background: {{st.screens.bg}}; color: {{st.screens.fg}}; font-weight: {{st.screens.fw}};">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="10" rx="1.6"/><rect x="9" y="11" width="13" height="9" rx="1.6" fill="#252A3E"/></svg>
      Screens
    </a>
    <a href="Preview.dc.html" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border-radius: 8px; text-decoration: none; font-size: 12.5px; background: {{st.preview.bg}}; color: {{st.preview.fg}}; font-weight: {{st.preview.fw}};">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
      Preview
    </a>
    <button type="button" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; color: #C7CBD6; font-size: 12.5px; font-weight: 600; text-align: left;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h9A1.5 1.5 0 0 1 21 10v7.5A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z"/></svg>
      Sources
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; color: #C7CBD6; font-size: 12.5px; font-weight: 600; text-align: left;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M6 11h12M8 15h8M10 19h4"/></svg>
      Collections
    </button>
    <a href="Apply.dc.html" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border-radius: 8px; text-decoration: none; font-size: 12.5px; background: {{st.history.bg}}; color: {{st.history.fg}}; font-weight: {{st.history.fw}};">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      History
    </a>
    <button type="button" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; color: #C7CBD6; font-size: 12.5px; font-weight: 600; text-align: left;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.9 7l1.7 1M17.4 16l1.7 1M4.9 17l1.7-1M17.4 8l1.7-1M3 12h2M19 12h2"/></svg>
      Settings
    </button>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 10px; background: #2B3044;">
    <span style="font-size: 10px; font-weight: 800; letter-spacing: 0.07em; color: #FFC700;">THIS MACHINE</span>
    <span style="font-size: 10.5px; color: #C7CBD6; line-height: 1.45;">Cinnamon 6.4<br>slick-greeter<br>Plymouth · GRUB 2</span>
    <span style="font-size: 10px; color: #9AA0B0;">5 of 5 screens supported</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"active":{"editor":"enum","options":["browse","image","screens","preview","history"],"default":"browse"},"$preview":{"width":150,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'browse';
    const st = {};
    for (const key of ['browse', 'image', 'screens', 'preview', 'history']) {
      st[key] = key === active
        ? { bg: 'rgba(255,199,0,0.14)', fg: '#FFC700', fw: '700' }
        : { bg: 'transparent', fg: '#C7CBD6', fw: '600' };
    }
    return { st };
  }
}
</script>
</body>
</html>
