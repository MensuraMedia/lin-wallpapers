<?xml version="1.0" encoding="UTF-8"?>
<!--
  LinWallpaper application icon.
  The mark is the same screen-showing-a-landscape glyph as the repo's
  io.mensuramedia.LinWallpapers icon, re-tinted to the app's libadwaita blue
  accent (illustrative: #3584e4 -> #1c71d8 tile, white glyph). Drawn on the
  46-unit tile with the glyph on the shared 24-unit grid, translated (10,10)
  and scaled 26/24.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 46 46">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <rect width="46" height="46" rx="14" ry="14" fill="url(#tile)"/>
  <g transform="translate(10 10) scale(1.0833333)"
     fill="none" stroke="#ffffff" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="13" rx="2" ry="2"/>
    <path d="M3 14 L7.5 10 L11 13 L14.5 9 L21 14"/>
    <circle cx="9" cy="8.5" r="1.3"/>
    <path d="M8 20 L16 20"/>
  </g>
</svg>
