# /etc/default/grub.d/99-linwallpaper-background.cfg — installed by LinWallpaper's privileged helper.
# GRUB menu shows the desktop wallpaper (a copy generated from the chosen wallpaper).
# This is a drop-in; it never edits /etc/default/grub itself.
GRUB_BACKGROUND=/boot/grub/linwallpaper-wallpaper.png
GRUB_GFXMODE=1920x1080,auto
