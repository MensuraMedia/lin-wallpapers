<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lin Wallpapers application icon.
  Colours mirror resources/css/tokens.css (accent #FFC700, accent-2 #FFB500,
  on-accent #1A1400); the mark reproduces src/ui/sidebar.py::LogoMark — a
  screen showing a landscape, on a stand — so the launcher icon and the in-app
  logo are the same drawing. viewBox is the 46-unit logo tile; the glyph sits on
  the shared 24-unit grid, translated (10,10) and scaled 26/24, exactly as drawn.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 46 46">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC700"/>
      <stop offset="1" stop-color="#FFB500"/>
    </linearGradient>
  </defs>
  <rect width="46" height="46" rx="14" ry="14" fill="url(#tile)"/>
  <g transform="translate(10 10) scale(1.0833333)"
     fill="none" stroke="#1A1400" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="13" rx="2" ry="2"/>
    <path d="M3 14 L7.5 10 L11 13 L14.5 9 L21 14"/>
    <circle cx="9" cy="8.5" r="1.3"/>
    <path d="M8 20 L16 20"/>
  </g>
</svg>
