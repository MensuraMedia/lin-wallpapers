<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lin Wallpapers symbolic icon (monochrome, recoloured by the theme).
  Provided for symbolic contexts (dark panels, high-contrast). NOTE: this
  project runs no background process, so there is no system tray to host it;
  it exists for completeness alongside the full-colour app icon. Drawn on a
  16-unit grid as the same screen-with-landscape mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="none" stroke="#2e3436" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2.5" width="12" height="9" rx="1.4" ry="1.4"/>
    <path d="M2 9 L5 6.5 L7.5 8.5 L9.5 6 L14 9"/>
    <circle cx="6" cy="5.4" r="0.9"/>
    <path d="M5.5 13.5 L10.5 13.5"/>
  </g>
</svg>
